name: Build, tests & Docker
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUN_CONTAINER_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: web/package-lock.json }
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release --logger 'trx;LogFileName=tests.trx' --results-directory artifacts/tests
      - run: npm ci && npm run build && npm audit --omit=dev
        working-directory: web
      - run: docker build --target api -t techdocs-api:ci . && docker build --target worker -t techdocs-worker:ci .
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: test-results, path: artifacts/tests }
